<section class="pagina">
  <h2>Entrada de Produtos</h2>

  <form (ngSubmit)="salvarEntrada()">

    <div class="campo">
      <label>Produto</label>

      <select
        name="iditem"
        [(ngModel)]="novaEntrada.iditem"
        required>

        <option [ngValue]="0">Selecione o produto</option>

        <option
          *ngFor="let produto of produtos"
          [ngValue]="produto.iditem">
          {{ produto.item1 }}
        </option>

      </select>
    </div>

    <div class="campo">
      <label>Data da Entrada</label>

      <input
        type="date"
        name="dataEntradaProduto"
        [(ngModel)]="novaEntrada.dataEntradaProduto"
        required>
    </div>

    <div class="campo">
      <label>Quantidade</label>

      <input
        type="number"
        name="quantidadeEntrada"
        [(ngModel)]="novaEntrada.quantidadeEntrada"
        placeholder="Digite a quantidade"
        min="1"
        required>
    </div>

    <div class="campo">
      <label>Unidade</label>

      <input
        type="text"
        name="unidade"
        [(ngModel)]="novaEntrada.unidade"
        placeholder="Ex: UN"
        required>
    </div>

    <div class="campo">
      <label>Valor Unitário</label>

      <input
        type="number"
        name="valorUnitarioEntrada"
        [(ngModel)]="novaEntrada.valorUnitarioEntrada"
        step="0.01"
        min="0"
        placeholder="0,00"
        required>
    </div>

    <div class="botoes">
      <button type="submit">
        Salvar Entrada
      </button>

      <button type="reset" class="limpar">
        Limpar
      </button>
    </div>

  </form>

  <h2>Entradas Cadastradas</h2>

  <table>
    <thead>
      <tr>
        <th>ID Entrada</th>
        <th>ID Produto</th>
        <th>Data</th>
        <th>Quantidade</th>
        <th>Unidade</th>
        <th>Valor Unitário</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let entrada of entradas">
        <td>{{ entrada.identradaProduto }}</td>
        <td>{{ entrada.iditem }}</td>
        <td>{{ entrada.dataEntradaProduto }}</td>
        <td>{{ entrada.quantidadeEntrada }}</td>
        <td>{{ entrada.unidade }}</td>
        <td>
          R$ {{ entrada.valorUnitarioEntrada | number:'1.2-2' }}
        </td>
      </tr>
    </tbody>
  </table>

</section>
